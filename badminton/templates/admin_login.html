{% extends "base.html" %}
{% block title %}운영진 로그인{% endblock %}
{% block content %}
<div style="max-width:380px;margin:32px auto 0;text-align:center">
  <h1>운영진 로그인</h1>
  <p class="sub">명단 불러오기와 대진 관리는 운영진만 할 수 있어요.</p>
  {% if error %}<div class="note err">{{ error }}</div>{% endif %}
  <form method="post" class="section" style="text-align:left">
    <label class="field">비밀번호<input type="password" name="password" autofocus required></label>
    <button class="btn" style="width:100%">로그인</button>
  </form>
</div>
{% endblock %}
